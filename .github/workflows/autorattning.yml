name: Autorättning

# Körs när en elev pushar till sin fork.
# I lärarens original hoppas den över, så att originalet inte visar rött kryss
# (där är ju uppgifterna inte lösta). Läraren kan ändå starta den manuellt
# under fliken Actions -> Autorättning -> Run workflow.
on:
  push:
  workflow_dispatch:

jobs:
  testa:
    if: github.event.repository.fork || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kör testerna
        run: >
          dotnet test learn-csharp-with-oskar.sln
          --logger trx
          --logger "console;verbosity=normal"
          --results-directory testresultat

      - name: Skriv sammanfattning
        if: always()
        run: python3 .github/scripts/sammanfattning.py testresultat >> "$GITHUB_STEP_SUMMARY"
